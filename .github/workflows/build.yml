name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: ForgeApp-windows
          - os: macos-latest
            artifact-name: ForgeApp-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller main.spec --noconfirm

      - name: Ad-hoc sign app (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/Forge.app

      - name: Zip Mac app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Forge.app Forge-mac.zip

      - name: Upload Windows exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/Forge.exe

      - name: Upload Mac app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/Forge-mac.zip
